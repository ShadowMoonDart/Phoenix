<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飛鏢隊伍管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-16">

  <!-- 頂部導航 -->
  <header class="bg-slate-800 p-4 sticky top-0 z-40 border-b border-slate-700 flex justify-between items-center shadow-lg">
    <h1 class="text-xl font-black text-rose-500 tracking-wider">🎯 DART TEAM</h1>
    <div id="userInfo" class="text-xs">尚未登入</div>
  </header>

  <!-- 標籤導航欄 -->
  <nav class="flex justify-around bg-slate-800 border-b border-slate-700 text-xs font-semibold sticky top-14 z-30">
    <button onclick="switchTab('matches')" id="btn-matches" class="tab-btn p-3 border-b-2 border-rose-500 text-rose-500">賽事簽到</button>
    <button onclick="switchTab('stats')" id="btn-stats" class="tab-btn p-3 border-b-2 border-transparent">出席率</button>
    <button onclick="switchTab('admin')" id="adminTabBtn" class="tab-btn p-3 border-b-2 border-transparent hidden text-yellow-400">隊長管理</button>
  </nav>

  <div class="p-4 max-w-lg mx-auto">

    <!-- 登入面板 -->
    <section id="authSection" class="bg-slate-800 p-5 rounded-2xl border border-slate-700 my-4 shadow-lg">
      <h2 class="text-base font-bold mb-3" id="authTitle">隊員登入</h2>
      <div class="space-y-3">
        <input type="email" id="email" placeholder="電郵" class="w-full p-2.5 rounded bg-slate-700 text-xs border border-slate-600 focus:outline-none">
        <input type="password" id="password" placeholder="密碼" class="w-full p-2.5 rounded bg-slate-700 text-xs border border-slate-600 focus:outline-none">
        <div id="registerFields" class="hidden space-y-3">
          <input type="text" id="regName" placeholder="隊員姓名 / 鏢名" class="w-full p-2.5 rounded bg-slate-700 text-xs border border-slate-600">
          <input type="number" step="0.01" id="regRating" placeholder="Rating (鏢力)" class="w-full p-2.5 rounded bg-slate-700 text-xs border border-slate-600">
        </div>
        <button onclick="handleAuthAction()" id="authSubmitBtn" class="w-full bg-rose-600 hover:bg-rose-500 font-bold p-2.5 rounded text-xs transition">登入</button>
        <p class="text-center text-xs text-slate-400">
          <span id="authToggleText">仲未有帳號？</span>
          <a href="#" onclick="toggleAuthMode()" id="authToggleLink" class="text-rose-400 underline ml-1">按此註冊</a>
        </p>
      </div>
    </section>

    <!-- 1. 內部賽程與簽到分頁 -->
    <section id="tab-matches" class="space-y-4">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-sm font-bold text-slate-200">隊伍本季賽程</h2>
          <p id="currentTeamBadge" class="text-[11px] text-slate-400">未設定組別</p>
        </div>
        <button onclick="loadMatches()" id="syncBtn" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 shadow">
          <span>🔄 重新整理</span>
        </button>
      </div>
      <div id="matchesContainer" class="space-y-3">
        <p class="text-xs text-slate-400 text-center py-4">正在取得賽程...</p>
      </div>
    </section>

    <!-- 2. 出席率統計分頁 -->
    <section id="tab-stats" class="hidden space-y-4">
      <h2 class="text-sm font-bold text-slate-300">隊員出席排行榜</h2>
      <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-700 text-slate-300">
            <tr><th class="p-3">隊員</th><th class="p-3">Rating</th><th class="p-3">出席場數</th></tr>
          </thead>
          <tbody id="statsTableBody" class="divide-y divide-slate-700"></tbody>
        </table>
      </div>
    </section>

    <!-- 3. 隊長管理分頁 (Scroll-down menu 聯動選單) -->
    <section id="tab-admin" class="hidden space-y-4">
      <h2 class="text-sm font-bold text-yellow-400">隊長專屬後台</h2>

      <div class="bg-slate-800 p-4 rounded-xl border border-yellow-500/30 space-y-3 shadow-lg">
        <div class="flex justify-between items-center">
          <h3 class="text-xs font-bold text-yellow-400">🎯 Phoenix 聯賽組別及隊伍 (選單設定)</h3>
          <a href="https://play.phoenixdarts.com/selectCpttnList.do?cpttnType=ML" target="_blank" class="text-[10px] text-rose-400 underline">官網賽季列表 ↗</a>
        </div>
        <p class="text-[11px] text-slate-400">貼上官網賽程或成績網址，系統將讀取組別與參賽隊伍：</p>

        <div>
          <label class="text-slate-400 block mb-1 text-[11px]">貼上官網網址 (或填 cpttnId)</label>
          <div class="flex gap-1.5">
            <input type="text" id="cfgUrlInput" value="https://play.phoenixdarts.com/selectMatchDetailML.do?cpttnId=97460&searchDivision=94563" class="w-full p-2 rounded bg-slate-700 border border-slate-600 text-xs">
            <button onclick="fetchDropdownData()" id="fetchMenuBtn" class="bg-blue-600 hover:bg-blue-500 px-3 rounded font-bold text-xs whitespace-nowrap">🔍 讀取選單</button>
          </div>
        </div>

        <div>
          <label class="text-slate-300 block mb-1 text-[11px] font-bold">1. 選擇組別 (Division Scroll-down)</label>
          <select id="divisionDropdown" onchange="onDivisionChange()" class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 text-xs text-white">
            <option value="94563">Division 3 (94563)</option>
          </select>
        </div>

        <div>
          <label class="text-slate-300 block mb-1 text-[11px] font-bold">2. 選擇我隊 (Team Scroll-down)</label>
          <select id="teamDropdown" class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 text-xs text-white">
            <option value="all">[同步全組所有比賽]</option>
          </select>
        </div>

        <button onclick="applyAndSyncSchedule()" id="applyBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold p-2.5 rounded text-xs transition shadow flex justify-center items-center gap-1.5">
          <span>🔄 確認並同步該組賽程 (9場制)</span>
        </button>
      </div>

      <!-- 待審批會員 -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <h3 class="text-xs font-bold mb-2">待審批會員啟用</h3>
        <div id="pendingUsersList" class="space-y-2 text-xs"></div>
      </div>
    </section>

  </div>

  <!-- Modal 1：查看 9 場陣容 -->
  <div id="detailModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-800 rounded-2xl max-w-lg w-full max-h-[85vh] flex flex-col border border-slate-700 shadow-2xl">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/40">
        <div>
          <h3 id="modalMatchTitle" class="text-sm font-bold text-white"></h3>
          <p id="modalMatchSubtitle" class="text-[11px] text-slate-400"></p>
        </div>
        <button onclick="closeModal('detailModal')" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
      </div>
      <div class="p-4 overflow-y-auto space-y-4 text-xs">
        <div>
          <h4 class="font-bold text-yellow-400 text-xs mb-2">🎯 9 場對賽排陣</h4>
          <div id="modalLineupList" class="space-y-1.5 bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/60">載入中...</div>
        </div>
        <div>
          <h4 class="font-bold text-slate-300 mb-2">👥 內部簽到出席名單</h4>
          <div id="modalAttList" class="space-y-1.5 max-h-40 overflow-y-auto">載入中...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal 2：隊長 9 場排陣 Modal -->
  <div id="lineupModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-800 rounded-2xl max-w-lg w-full max-h-[90vh] flex flex-col border border-yellow-500/50 shadow-2xl">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-yellow-500/10">
        <div>
          <h3 class="text-sm font-bold text-yellow-400">🎯 隊長 9 場排陣系統</h3>
          <p class="text-[11px] text-slate-300">只允許安排【已簽到出席 / 遲到】之隊友</p>
        </div>
        <button onclick="closeModal('lineupModal')" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
      </div>
      <div class="p-4 overflow-y-auto space-y-3.5 text-xs" id="lineupLegsContainer"></div>
      <div class="p-4 border-t border-slate-700 bg-slate-800">
        <button onclick="submitLineup()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold p-2.5 rounded text-xs transition">儲存並公開 9 場陣容</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyqU3xJzzh9HpIwb1zXBDWmvNkzzsmaPYrJYx6fv0ezms8YUJU966obQjkkGV3nBwRctg/exec";

    let currentUser = null;
    try { currentUser = JSON.parse(localStorage.getItem('dart_user')) || null; } catch(e) {}
    let isRegisterMode = false;
    let currentLineupMatchId = null;
    let currentAvailablePlayers = [];
    let currentLegFormat = [];
    let currentSettings = { cpttnId: "97460", divisionId: "94563", teamName: "" };

    // 封裝超時保護 (8 秒自動終止，絕不卡死)
    async function apiRequest(method, payload = {}) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);
      try {
        let res;
        if (method === 'GET') {
          const query = new URLSearchParams(payload).toString();
          res = await fetch(`${API_URL}?${query}`, { signal: controller.signal });
        } else {
          res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload),
            redirect: 'follow',
            signal: controller.signal
          });
        }
        clearTimeout(timeoutId);
        return await res.json();
      } catch (err) {
        clearTimeout(timeoutId);
        return { success: false, error: err.name === 'AbortError' ? '連線逾時（伺服器回應過慢）' : err.toString() };
      }
    }

    window.onload = () => {
      checkAuthState();
      loadMatches();
    };

    function checkAuthState() {
      if (currentUser) {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('userInfo').innerHTML = `
          <span>${currentUser.name} (${currentUser.role === 'admin' ? '<b class="text-yellow-400">隊長</b>' : '隊員'})</span>
          <button onclick="logout()" class="ml-2 text-rose-400 underline">登出</button>
        `;
        if (currentUser.role === 'admin') {
          document.getElementById('adminTabBtn').classList.remove('hidden');
          loadAdminData();
        }
      } else {
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('userInfo').innerText = '尚未登入';
        document.getElementById('adminTabBtn').classList.add('hidden');
      }
    }

    function switchTab(tabId) {
      ['matches', 'stats', 'admin'].forEach(t => {
        const el = document.getElementById(`tab-${t}`);
        const btn = document.getElementById(`btn-${t}`) || document.getElementById('adminTabBtn');
        if (el) el.classList.add('hidden');
        if (btn) {
          btn.classList.remove('border-rose-500', 'text-rose-500');
          btn.classList.add('border-transparent');
        }
      });
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`btn-${tabId}`) || document.getElementById('adminTabBtn');
      if (activeBtn) {
        activeBtn.classList.add('border-rose-500', 'text-rose-500');
        activeBtn.classList.remove('border-transparent');
      }
      if (tabId === 'stats') loadStats();
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('authTitle').innerText = isRegisterMode ? '隊員註冊' : '隊員登入';
      document.getElementById('authSubmitBtn').innerText = isRegisterMode ? '提交註冊' : '登入';
      document.getElementById('registerFields').classList.toggle('hidden', !isRegisterMode);
    }

    async function handleAuthAction() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!email || !password) return alert('請輸入電郵及密碼');

      if (isRegisterMode) {
        const name = document.getElementById('regName').value.trim();
        const rating = document.getElementById('regRating').value.trim();
        if (!name) return alert('請輸入姓名');
        const res = await apiRequest('POST', { action: 'register', email, password, name, rating });
        alert(res.message || '註冊已送出');
        if (res.success) toggleAuthMode();
      } else {
        const res = await apiRequest('POST', { action: 'login', email, password });
        if (res.success) {
          currentUser = res.user;
          localStorage.setItem('dart_user', JSON.stringify(currentUser));
          checkAuthState();
          loadMatches();
        } else {
          alert(res.message || '登入失敗');
        }
      }
    }

    function logout() {
      localStorage.removeItem('dart_user');
      currentUser = null;
      checkAuthState();
      loadMatches();
    }

    // 載入賽程
    async function loadMatches() {
      const container = document.getElementById('matchesContainer');
      const badge = document.getElementById('currentTeamBadge');
      container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">讀取中...</p>';

      // 並行取得賽程與設定
      const [json, setRes] = await Promise.all([
        apiRequest('GET', { action: 'getMatches' }),
        apiRequest('GET', { action: 'getSettings' })
      ]);

      if (setRes.success && setRes.settings) {
        currentSettings = setRes.settings;
        badge.innerText = `我隊：${setRes.settings.teamName || '全組賽程'} | 組別：${setRes.settings.divisionId}`;
      } else {
        badge.innerText = '組別：' + currentSettings.divisionId;
      }

      if (!json.success || !json.matches || json.matches.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 bg-slate-800 rounded-xl border border-slate-700">
            <p class="text-slate-400 text-xs mb-3">目前內部尚無賽事紀錄</p>
            ${currentUser && currentUser.role === 'admin' ? `
              <button onclick="switchTab('admin')" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded font-bold">前往後台同步 Phoenix 賽程</button>
            ` : '<p class="text-[11px] text-slate-500">請等待隊長在後台同步最新賽程</p>'}
          </div>
        `;
        return;
      }

      const isAdmin = currentUser && currentUser.role === 'admin';

      container.innerHTML = json.matches.map(m => {
        const isFinished = m.score && (m.score.includes('-') || m.score.includes(':') || /\d+\s*\/\s*\d+/.test(m.score));
        return `
          <div class="bg-slate-800 p-4 rounded-xl border ${isFinished ? 'border-slate-700/60' : 'border-slate-700'} space-y-2.5 shadow">
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-1.5">
                <span class="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded font-mono font-bold">第 ${m.round || '-'} 輪</span>
                <span class="text-[10px] ${m.isHome ? 'bg-rose-600' : 'bg-blue-600'} px-2 py-0.5 rounded font-bold">${m.isHome ? '主場' : '客場'}</span>
                ${isFinished ? `<span class="text-[10px] bg-emerald-600 px-2 py-0.5 rounded font-bold">已完賽 ${m.score}</span>` : '<span class="text-[10px] bg-amber-600 px-2 py-0.5 rounded font-bold">未完賽</span>'}
              </div>
              <span class="text-xs text-slate-400">${m.date || ''}</span>
            </div>

            <div class="flex justify-between items-center">
              <h3 class="font-bold text-base text-white">VS ${m.opponent}</h3>
              ${isFinished ? `<span class="text-yellow-400 font-black text-sm bg-slate-900 px-2 py-0.5 rounded">${m.score}</span>` : ''}
            </div>
            <p class="text-xs text-slate-300">📍 地點: ${m.venue || '官方場地'}</p>

            <div class="flex items-center gap-3 bg-slate-900/60 p-2 rounded-lg text-[11px]">
              <span class="text-emerald-400 font-semibold">出席: ${m.counts.attending}</span>
              <span class="text-amber-400 font-semibold">遲到: ${m.counts.late}</span>
              <span class="text-rose-400 font-semibold">缺席: ${m.counts.absent}</span>
              <button onclick="viewMatchDetails('${m.id}', '${m.opponent}', '${m.venue}', '${m.score || ''}')" class="ml-auto text-rose-400 hover:text-rose-300 underline font-medium">
                查看簽到/排陣 ↗
              </button>
            </div>

            ${!isFinished ? `
              <div class="grid grid-cols-3 gap-2 pt-1 border-t border-slate-700/60">
                <button onclick="submitAttendance('${m.id}', 'attending')" class="bg-emerald-600 hover:bg-emerald-500 py-1.5 rounded text-xs font-semibold">出席 👍</button>
                <button onclick="submitAttendance('${m.id}', 'late')" class="bg-amber-600 hover:bg-amber-500 py-1.5 rounded text-xs font-semibold">遲到 ⏰</button>
                <button onclick="submitAttendance('${m.id}', 'absent')" class="bg-rose-600 hover:bg-rose-500 py-1.5 rounded text-xs font-semibold">缺席 ❌</button>
              </div>
              ${isAdmin ? `
                <div class="pt-1">
                  <button onclick="openLineupModal('${m.id}', '${m.opponent}')" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-1.5 rounded text-xs">🎯 隊長 9 場排陣 (限出席隊友)</button>
                </div>
              ` : ''}
            ` : ''}
          </div>
        `;
      }).join('');
    }

    async function submitAttendance(matchId, st
