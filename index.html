<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飛鏢隊伍管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- 頂部導航 -->
  <header class="bg-slate-800 p-4 sticky top-0 z-50 border-b border-slate-700 flex justify-between items-center">
    <h1 class="text-xl font-black text-rose-500 tracking-wider">🎯 DART TEAM</h1>
    <div id="userInfo" class="text-sm">尚未登入</div>
  </header>

  <!-- 標籤導航欄 (Tab Bar) -->
  <nav class="flex justify-around bg-slate-800 border-b border-slate-700 text-xs font-semibold">
    <button onclick="switchTab('matches')" class="tab-btn p-3 border-b-2 border-rose-500 text-rose-500">賽事簽到</button>
    <button onclick="switchTab('phoenix')" class="tab-btn p-3 border-b-2 border-transparent">Phoenix 聯賽</button>
    <button onclick="switchTab('stats')" class="tab-btn p-3 border-b-2 border-transparent">出席率</button>
    <button onclick="switchTab('admin')" id="adminTabBtn" class="tab-btn p-3 border-b-2 border-transparent hidden">後台管理</button>
  </nav>

  <div class="p-4 max-w-lg mx-auto">

    <!-- 登入/註冊面板 (未登入時顯示) -->
    <section id="authSection" class="bg-slate-800 p-6 rounded-2xl border border-slate-700 my-4">
      <h2 class="text-lg font-bold mb-4" id="authTitle">隊員登入</h2>
      <div class="space-y-3">
        <input type="email" id="email" placeholder="電郵" class="w-full p-2.5 rounded bg-slate-700 text-sm border border-slate-600 focus:outline-none">
        <input type="password" id="password" placeholder="密碼" class="w-full p-2.5 rounded bg-slate-700 text-sm border border-slate-600 focus:outline-none">
       
        <div id="registerFields" class="hidden space-y-3">
          <input type="text" id="regName" placeholder="隊員姓名 / 鏢名" class="w-full p-2.5 rounded bg-slate-700 text-sm border border-slate-600">
          <input type="number" step="0.01" id="regRating" placeholder="Rating (鏢力)" class="w-full p-2.5 rounded bg-slate-700 text-sm border border-slate-600">
        </div>

        <button onclick="handleAuthAction()" id="authSubmitBtn" class="w-full bg-rose-600 hover:bg-rose-500 font-bold p-2.5 rounded text-sm transition">登入</button>
        <p class="text-center text-xs text-slate-400 mt-2">
          <span id="authToggleText">仲未有帳號？</span>
          <a href="#" onclick="toggleAuthMode()" id="authToggleLink" class="text-rose-400 underline">按此註冊</a>
        </p>
      </div>
    </section>

    <!-- 1. 內部賽程與簽到分頁 -->
    <section id="tab-matches" class="space-y-4">
      <h2 class="text-base font-bold text-slate-300">隊伍賽程 (簽到 / 報名)</h2>
      <div id="matchesContainer" class="space-y-3">
        <!-- 動態渲染賽程卡片 -->
      </div>
    </section>

    <!-- 2. Phoenix 官網聯賽數據分頁 -->
    <section id="tab-phoenix" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-base font-bold text-slate-300">Phoenix Darts 賽程同步</h2>
        <button onclick="loadPhoenixData()" class="text-xs bg-slate-700 px-2 py-1 rounded">更新數據</button>
      </div>
      <div id="phoenixDataContainer" class="space-y-2 text-xs">
        <p class="text-slate-400 text-center">載入中...</p>
      </div>
    </section>

    <!-- 3. 出席率統計分頁 -->
    <section id="tab-stats" class="hidden space-y-4">
      <h2 class="text-base font-bold text-slate-300">隊員出席榜</h2>
      <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-700 text-slate-300">
            <tr>
              <th class="p-3">隊員</th>
              <th class="p-3">Rating</th>
              <th class="p-3">出席次數</th>
            </tr>
          </thead>
          <tbody id="statsTableBody" class="divide-y divide-slate-700"></tbody>
        </table>
      </div>
    </section>

    <!-- 4. 後台管理分頁 (Admin Only) -->
    <section id="tab-admin" class="hidden space-y-4">
      <h2 class="text-base font-bold text-yellow-400">Admin 後台管理</h2>
     
      <!-- 審批隊員 -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <h3 class="text-sm font-semibold mb-2">待審批會員 (Activate)</h3>
        <div id="pendingUsersList" class="space-y-2 text-xs"></div>
      </div>

      <!-- 新增賽程 -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2">
        <h3 class="text-sm font-semibold mb-2">新增賽事</h3>
        <input type="datetime-local" id="newMatchDate" class="w-full p-2 rounded bg-slate-700 text-xs">
        <input type="text" id="newOpponent" placeholder="對手隊名" class="w-full p-2 rounded bg-slate-700 text-xs">
        <input type="text" id="newVenue" placeholder="比賽場地 (鏢吧)" class="w-full p-2 rounded bg-slate-700 text-xs">
        <button onclick="addMatch()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold p-2 rounded text-xs">儲存賽事</button>
      </div>
    </section>

  </div>

  <script>
    // ⚠️ 替換成你的 Google Apps Script Web App URL
    const API_URL = "https://script.google.com/macros/s/AKfycbyqU3xJzzh9HpIwb1zXBDWmvNkzzsmaPYrJYx6fv0ezms8YUJU966obQjkkGV3nBwRctg/exec";

    let currentUser = JSON.parse(localStorage.getItem('dart_user')) || null;
    let isRegisterMode = false;

    window.onload = () => {
      checkAuthState();
      loadMatches();
    };

    function checkAuthState() {
      if (currentUser) {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('userInfo').innerHTML = `
          <span>${currentUser.name} (${currentUser.role})</span>
          <button onclick="logout()" class="ml-2 text-rose-400 underline">登出</button>
        `;
        if (currentUser.role === 'admin') {
          document.getElementById('adminTabBtn').classList.remove('hidden');
          loadAdminData();
        }
      } else {
        document.getElementById('authSection').classList.remove('hidden');
      }
    }

    // Tab 切換
    function switchTab(tabId) {
      ['matches', 'phoenix', 'stats', 'admin'].forEach(t => {
        const el = document.getElementById(`tab-${t}`);
        if (el) el.classList.add('hidden');
      });
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
     
      if (tabId === 'phoenix') loadPhoenixData();
      if (tabId === 'stats') loadStats();
    }

    // 登入 / 註冊切換
    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('authTitle').innerText = isRegisterMode ? '隊員註冊' : '隊員登入';
      document.getElementById('authSubmitBtn').innerText = isRegisterMode ? '提交註冊' : '登入';
      document.getElementById('registerFields').classList.toggle('hidden', !isRegisterMode);
    }

    async function handleAuthAction() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (isRegisterMode) {
        const name = document.getElementById('regName').value;
        const rating = document.getElementById('regRating').value;
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'register', email, password, name, rating })
        });
        const data = await res.json();
        alert(data.message);
        toggleAuthMode();
      } else {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', email, password })
        });
        const data = await res.json();
        if (data.success) {
          currentUser = data.user;
          localStorage.setItem('dart_user', JSON.stringify(currentUser));
          checkAuthState();
        } else {
          alert(data.message);
        }
      }
    }

    function logout() {
      localStorage.removeItem('dart_user');
      location.reload();
    }

    // 讀取 Phoenix 聯賽爬蟲資料
    async function loadPhoenixData() {
      const container = document.getElementById('phoenixDataContainer');
      container.innerHTML = '正在從 Phoenix Darts 同步賽程...';
      try {
        const res = await fetch(`${API_URL}?action=getPhoenixData`);
        const json = await res.json();
        if (json.success && json.data.length > 0) {
          container.innerHTML = json.data.map(m => `
            <div class="bg-slate-800 p-3 rounded-lg border border-slate-700">
              <div class="flex justify-between text-slate-400 mb-1">
                <span>第 ${m.round} 輪</span>
                <span>${m.date}</span>
              </div>
              <div class="flex justify-between items-center text-sm font-bold">
                <span class="${m.homeTeam.includes('你隊伍名') ? 'text-rose-400' : ''}">${m.homeTeam}</span>
                <span class="bg-slate-900 px-2 py-1 rounded text-yellow-400">${m.score || 'VS'}</span>
                <span class="${m.awayTeam.includes('你隊伍名') ? 'text-rose-400' : ''}">${m.awayTeam}</span>
              </div>
              <p class="text-slate-400 mt-1">地點: ${m.venue}</p>
            </div>
          `).join('');
        } else {
          container.innerHTML = '暫無 Phoenix 賽事數據或賽程未公布。';
        }
      } catch (e) {
        container.innerHTML = '連線 Phoenix 失敗，請重試。';
      }
    }

    // 簽到操作
    async function submitAttendance(matchId, status) {
      if (!currentUser) return alert('請先登入！');
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'checkIn', matchId, userId: currentUser.id, status })
      });
      alert('已更新簽到狀態！');
    }

    // 載入賽程
    async function loadMatches() {
      const res = await fetch(`${API_URL}?action=getMatches`);
      const json = await res.json();
      const container = document.getElementById('matchesContainer');
     
      if (json.matches.length === 0) {
        container.innerHTML = '<p class="text-sm text-slate-400">目前沒有賽程</p>';
        return;
      }

      container.innerHTML = json.matches.map(m => `
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
          <div class="flex justify-between items-center">
            <span class="text-xs bg-rose-600 px-2 py-0.5 rounded font-bold">${m[4] ? '主場 HOME' : '客場 AWAY'}</span>
            <span class="text-xs text-slate-400">${new Date(m[1]).toLocaleDateString()}</span>
          </div>
          <h3 class="font-bold text-base">VS ${m[2]}</h3>
          <p class="text-xs text-slate-300">地點: ${m[3]}</p>
          <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-700">
            <button onclick="submitAttendance('${m[0]}', 'attending')" class="bg-emerald-600 hover:bg-emerald-500 py-1.5 rounded text-xs font-semibold">出席 👍</button>
            <button onclick="submitAttendance('${m[0]}', 'late')" class="bg-amber-600 hover:bg-amber-500 py-1.5 rounded text-xs font-semibold">遲到 ⏰</button>
            <button onclick="submitAttendance('${m[0]}', 'absent')" class="bg-rose-600 hover:bg-rose-500 py-1.5 rounded text-xs font-semibold">缺席 ❌</button>
          </div>
        </div>
      `).join('');
    }

    // 載入出席率
    async function loadStats() {
      const res = await fetch(`${API_URL}?action=getStats`);
      const json = await res.json();
      const tbody = document.getElementById('statsTableBody');
      tbody.innerHTML = json.stats.map(s => `
        <tr>
          <td class="p-3 font-semibold">${s.name}</td>
          <td class="p-3">${s.rating}</td>
          <td class="p-3 text-emerald-400 font-bold">${s.attendedCount} 場</td>
        </tr>
      `).join('');
    }

    // Admin 功能: 載入待審核用戶
    async function loadAdminData() {
      const res = await fetch(`${API_URL}?action=getUsers`);
      const json = await res.json();
      const pendingList = document.getElementById('pendingUsersList');
      const pendingUsers = json.users.filter(u => u.status === 'pending');
     
      if (pendingUsers.length === 0) {
        pendingList.innerHTML = '<p class="text-slate-400">目前沒有等待審批的會員。</p>';
        return;
      }

      pendingList.innerHTML = pendingUsers.map(u => `
        <div class="flex justify-between items-center bg-slate-700 p-2 rounded">
          <span>${u.name} (${u.email})</span>
          <button onclick="activateUser('${u.id}')" class="bg-emerald-600 px-2 py-1 rounded text-xs">啟用帳號</button>
        </div>
      `).join('');
    }

    async function activateUser(userId) {
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'activateUser', userId })
      });
      alert('已啟用！');
      loadAdminData();
    }

    async function addMatch() {
      const date = document.getElementById('newMatchDate').value;
      const opponent = document.getElementById('newOpponent').value;
      const venue = document.getElementById('newVenue').value;
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'addMatch', date, opponent, venue, isHome: true, notes: '' })
      });
      alert('賽事已新增！');
      loadMatches();
    }
  </script>
</body>
</html>
