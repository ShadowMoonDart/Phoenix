<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飛鏢隊伍管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <!-- 頂部導航 -->
  <header class="bg-slate-800 p-4 sticky top-0 z-40 border-b border-slate-700 flex justify-between items-center shadow-md">
    <h1 class="text-xl font-black text-rose-500 tracking-wider">🎯 DART TEAM</h1>
    <div id="userInfo" class="text-xs">尚未登入</div>
  </header>

  <!-- 標籤導航欄 -->
  <nav class="flex justify-around bg-slate-800 border-b border-slate-700 text-xs font-semibold sticky top-14 z-30">
    <button onclick="switchTab('matches')" id="btn-matches" class="tab-btn p-3 border-b-2 border-rose-500 text-rose-500">賽事簽到</button>
    <button onclick="switchTab('phoenix')" id="btn-phoenix" class="tab-btn p-3 border-b-2 border-transparent">Phoenix 聯賽</button>
    <button onclick="switchTab('stats')" id="btn-stats" class="tab-btn p-3 border-b-2 border-transparent">出席率</button>
    <button onclick="switchTab('admin')" id="adminTabBtn" class="tab-btn p-3 border-b-2 border-transparent hidden text-yellow-400">隊長管理</button>
  </nav>

  <div class="p-4 max-w-lg mx-auto">

    <!-- 登入 / 註冊面板 -->
    <section id="authSection" class="bg-slate-800 p-5 rounded-2xl border border-slate-700 my-4 shadow-lg">
      <h2 class="text-base font-bold mb-3" id="authTitle">隊員登入</h2>
      <div class="space-y-3">
        <input type="email" id="email" placeholder="電郵" class="w-full p-2.5 rounded bg-slate-700 text-xs border border-slate-600 focus:outline-none">
        <input type="password" id="password" placeholder="密碼" class="w-full p-2.5 rounded bg-slate-700 text-xs border border-slate-600 focus:outline-none">
        <div id="registerFields" class="hidden space-y-3">
          <input type="text" id="regName" placeholder="隊員姓名 / 鏢名" class="w-full p-2.5 rounded bg-slate-700 text-xs border border-slate-600">
          <input type="number" step="0.01" id="regRating" placeholder="Rating (鏢力)" class="w-full p-2.5 rounded bg-slate-700 text-xs border border-slate-600">
        </div>
        <button onclick="handleAuthAction()" id="authSubmitBtn" class="w-full bg-rose-600 hover:bg-rose-500 font-bold p-2.5 rounded text-xs transition">登入</button>
        <p class="text-center text-xs text-slate-400">
          <span id="authToggleText">仲未有帳號？</span>
          <a href="#" onclick="toggleAuthMode()" id="authToggleLink" class="text-rose-400 underline ml-1">按此註冊</a>
        </p>
      </div>
    </section>

    <!-- 1. 內部賽程與簽到分頁 -->
    <section id="tab-matches" class="space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-slate-300">隊伍內部賽程</h2>
        <span class="text-xs text-slate-400">點擊查看出席或名單</span>
      </div>
      <div id="matchesContainer" class="space-y-3">載入賽程中...</div>
    </section>

    <!-- 2. Phoenix 官網聯賽數據分頁 -->
    <section id="tab-phoenix" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-sm font-bold text-slate-300">Phoenix 聯賽即時賽程</h2>
          <p id="phoenixCurrentDivision" class="text-xs text-slate-400">當前組別同步中...</p>
        </div>
        <button onclick="loadPhoenixData()" class="text-xs bg-slate-700 px-2.5 py-1.5 rounded hover:bg-slate-600">重新同步</button>
      </div>
      <div id="phoenixDataContainer" class="space-y-2 text-xs">載入中...</div>
    </section>

    <!-- 3. 出席率統計分頁 -->
    <section id="tab-stats" class="hidden space-y-4">
      <h2 class="text-sm font-bold text-slate-300">隊員出席排行榜</h2>
      <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-700 text-slate-300">
            <tr>
              <th class="p-3">隊員</th>
              <th class="p-3">Rating</th>
              <th class="p-3">出席次數</th>
            </tr>
          </thead>
          <tbody id="statsTableBody" class="divide-y divide-slate-700"></tbody>
        </table>
      </div>
    </section>

    <!-- 4. 隊長管理分頁 -->
    <section id="tab-admin" class="hidden space-y-4">
      <h2 class="text-sm font-bold text-yellow-400">隊長專屬後台</h2>

      <!-- Phoenix 賽季及組別設定 -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="text-xs font-bold text-slate-200">🎯 Phoenix 聯賽組別及賽季設定</h3>
          <a href="https://play.phoenixdarts.com/selectCpttnList.do?cpttnType=ML" target="_blank" class="text-[10px] text-rose-400 underline">官網賽季列表 ↗</a>
        </div>
        <p class="text-[11px] text-slate-400">換季或轉組別時，請在官網聯賽網址找出 cpttnId 與 searchDivision 並填入：</p>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="text-slate-400 block mb-1">賽事編號 (cpttnId)</label>
            <input type="text" id="cfgCpttnId" class="w-full p-2 rounded bg-slate-700 border border-slate-600">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">組別編號 (searchDivision)</label>
            <input type="text" id="cfgDivisionId" class="w-full p-2 rounded bg-slate-700 border border-slate-600">
          </div>
        </div>
        <div>
          <label class="text-slate-400 block mb-1 text-xs">我隊全名 (用於官網賽程標亮我隊)</label>
          <input type="text" id="cfgTeamName" placeholder="例如：Target Dragon" class="w-full p-2 rounded bg-slate-700 border border-slate-600 text-xs">
        </div>
        <button onclick="saveLeagueSettings()" class="w-full bg-blue-600 hover:bg-blue-500 font-bold p-2 rounded text-xs transition">儲存當季組別設定</button>
      </div>

      <!-- 待審批會員 -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <h3 class="text-xs font-bold mb-2">待審批會員啟用</h3>
        <div id="pendingUsersList" class="space-y-2 text-xs"></div>
      </div>

      <!-- 新增賽事 -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2">
        <h3 class="text-xs font-bold mb-1">手動新增賽事</h3>
        <input type="datetime-local" id="newMatchDate" class="w-full p-2 rounded bg-slate-700 text-xs">
        <input type="text" id="newOpponent" placeholder="對手隊名" class="w-full p-2 rounded bg-slate-700 text-xs">
        <input type="text" id="newVenue" placeholder="比賽場地 (鏢吧)" class="w-full p-2 rounded bg-slate-700 text-xs">
        <div class="flex items-center gap-2 text-xs text-slate-300">
          <input type="checkbox" id="newIsHome" checked> <label for="newIsHome">主場 (Home)</label>
        </div>
        <button onclick="addMatch()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold p-2 rounded text-xs">儲存賽事</button>
      </div>
    </section>

  </div>

  <!-- 彈出視窗 1：隊員查看出席名單與出賽排陣 Modal -->
  <div id="detailModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-800 rounded-2xl max-w-md w-full max-h-[85vh] flex flex-col border border-slate-700">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center">
        <div>
          <h3 id="modalMatchTitle" class="text-sm font-bold text-white"></h3>
          <p id="modalMatchVenue" class="text-xs text-slate-400"></p>
        </div>
        <button onclick="closeModal('detailModal')" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
      </div>
      <div class="p-4 overflow-y-auto space-y-4 text-xs">
        <!-- 出席名單分佈 -->
        <div>
          <h4 class="font-bold text-slate-300 mb-2">👥 隊友出席名單</h4>
          <div id="modalAttList" class="space-y-1.5">載入中...</div>
        </div>
        <!-- 隊長排陣名單 -->
        <div>
          <h4 class="font-bold text-yellow-400 mb-2">🎯 隊長正式排陣</h4>
          <div id="modalLineupList" class="space-y-1.5 bg-slate-900/50 p-2.5 rounded-xl border border-slate-700/60">尚未排陣</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 彈出視窗 2：隊長專屬排陣 Modal (只按出席隊友處理) -->
  <div id="lineupModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-800 rounded-2xl max-w-md w-full max-h-[90vh] flex flex-col border border-yellow-500/50 shadow-2xl">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-yellow-500/10">
        <div>
          <h3 class="text-sm font-bold text-yellow-400">🎯 隊長排陣系統</h3>
          <p class="text-[11px] text-slate-300">只允許指派【已簽到出席 / 遲到】之隊員</p>
        </div>
        <button onclick="closeModal('lineupModal')" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
      </div>
      <div class="p-4 overflow-y-auto space-y-4 text-xs" id="lineupLegsContainer">
        <!-- 動態產生組別 Legs 下拉選單 -->
      </div>
      <div class="p-4 border-t border-slate-700 bg-slate-800">
        <button onclick="submitLineup()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold p-2.5 rounded text-xs transition">儲存並公開排陣</button>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ 替換成你的 Google Apps Script Web App URL
    const API_URL = "https://script.google.com/macros/s/AKfycbyqU3xJzzh9HpIwb1zXBDWmvNkzzsmaPYrJYx6fv0ezms8YUJU966obQjkkGV3nBwRctg/exec";

    let currentUser = JSON.parse(localStorage.getItem('dart_user')) || null;
    let isRegisterMode = false;
    let currentLineupMatchId = null;
    let currentAvailablePlayers = []; // 當前已出席隊友名單
    let currentLegFormat = [];

    async function apiRequest(method, payload = {}) {
      try {
        if (method === 'GET') {
          const query = new URLSearchParams(payload).toString();
          const res = await fetch(`${API_URL}?${query}`);
          return await res.json();
        } else {
          const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload),
            redirect: 'follow'
          });
          return await res.json();
        }
      } catch (err) {
        console.error("API 連線失敗:", err);
        return { success: false, error: err.toString() };
      }
    }

    window.onload = () => {
      checkAuthState();
      loadMatches();
    };

    function checkAuthState() {
      if (currentUser) {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('userInfo').innerHTML = `
          <span>${currentUser.name} (${currentUser.role === 'admin' ? '<b class="text-yellow-400">隊長</b>' : '隊員'})</span>
          <button onclick="logout()" class="ml-2 text-rose-400 underline">登出</button>
        `;
        if (currentUser.role === 'admin') {
          document.getElementById('adminTabBtn').classList.remove('hidden');
          loadAdminData();
          loadSettings();
        }
      } else {
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('userInfo').innerText = '尚未登入';
        document.getElementById('adminTabBtn').classList.add('hidden');
      }
    }

    function switchTab(tabId) {
      ['matches', 'phoenix', 'stats', 'admin'].forEach(t => {
        const el = document.getElementById(`tab-${t}`);
        const btn = document.getElementById(`btn-${t}`) || document.getElementById('adminTabBtn');
        if (el) el.classList.add('hidden');
        if (btn) {
          btn.classList.remove('border-rose-500', 'text-rose-500');
          btn.classList.add('border-transparent');
        }
      });
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`btn-${tabId}`) || document.getElementById('adminTabBtn');
      if (activeBtn) {
        activeBtn.classList.add('border-rose-500', 'text-rose-500');
        activeBtn.classList.remove('border-transparent');
      }
      if (tabId === 'phoenix') loadPhoenixData();
      if (tabId === 'stats') loadStats();
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('authTitle').innerText = isRegisterMode ? '隊員註冊' : '隊員登入';
      document.getElementById('authSubmitBtn').innerText = isRegisterMode ? '提交註冊' : '登入';
      document.getElementById('registerFields').classList.toggle('hidden', !isRegisterMode);
    }

    async function handleAuthAction() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!email || !password) return alert('請輸入電郵及密碼');

      if (isRegisterMode) {
        const name = document.getElementById('regName').value.trim();
        const rating = document.getElementById('regRating').value.trim();
        if (!name) return alert('請輸入姓名');
        const res = await apiRequest('POST', { action: 'register', email, password, name, rating });
        alert(res.message);
        if (res.success) toggleAuthMode();
      } else {
        const res = await apiRequest('POST', { action: 'login', email, password });
        if (res.success) {
          currentUser = res.user;
          localStorage.setItem('dart_user', JSON.stringify(currentUser));
          checkAuthState();
          loadMatches();
        } else {
          alert(res.message);
        }
      }
    }

    function logout() {
      localStorage.removeItem('dart_user');
      currentUser = null;
      checkAuthState();
      loadMatches();
    }

    // 載入內部賽事列表 (包含出席簡報與排陣入口)
    async function loadMatches() {
      const container = document.getElementById('matchesContainer');
      const json = await apiRequest('GET', { action: 'getMatches' });
      if (!json.success || !json.matches || json.matches.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">目前沒有賽事</p>';
        return;
      }

      const isAdmin = currentUser && currentUser.role === 'admin';

      container.innerHTML = json.matches.map(m => `
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2.5 shadow">
          <div class="flex justify-between items-center">
            <span class="text-[10px] ${m.isHome ? 'bg-rose-600' : 'bg-blue-600'} px-2 py-0.5 rounded font-bold uppercase">${m.isHome ? '主場 HOME' : '客場 AWAY'}</span>
            <span class="text-xs text-slate-400">${m.date ? new Date(m.date).toLocaleString([], {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}) : ''}</span>
          </div>
          <h3 class="font-bold text-base text-white">VS ${m.opponent}</h3>
          <p class="text-xs text-slate-300">📍 地點: ${m.venue || '待定'}</p>

          <!-- 即時出席人數摘要 -->
          <div class="flex items-center gap-3 bg-slate-900/60 p-2 rounded-lg text-[11px]">
            <span class="text-emerald-400 font-semibold">出席: ${m.counts.attending}</span>
            <span class="text-amber-400 font-semibold">遲到: ${m.counts.late}</span>
            <span class="text-rose-400 font-semibold">缺席: ${m.counts.absent}</span>
            <button onclick="viewMatchDetails('${m.id}', '${m.opponent}', '${m.venue}')" class="ml-auto text-rose-400 underline font-medium">查看出席/排陣 ↗</button>
          </div>

          <!-- 簽到按鈕 -->
          <div class="grid grid-cols-3 gap-2 pt-1 border-t border-slate-700/60">
            <button onclick="submitAttendance('${m.id}', 'attending')" class="bg-emerald-600 hover:bg-emerald-500 py-1.5 rounded text-xs font-semibold">出席 👍</button>
            <button onclick="submitAttendance('${m.id}', 'late')" class="bg-amber-600 hover:bg-amber-500 py-1.5 rounded text-xs font-semibold">遲到 ⏰</button>
            <button onclick="submitAttendance('${m.id}', 'absent')" class="bg-rose-600 hover:bg-rose-500 py-1.5 rounded text-xs font-semibold">缺席 ❌</button>
          </div>

          <!-- 隊長專用排陣按鈕 -->
          ${isAdmin ? `
            <div class="pt-1">
              <button onclick="openLineupModal('${m.id}', '${m.opponent}')" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-1.5 rounded text-xs">🎯 隊長為此場排陣 (限出席隊友)</button>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    // 簽到
    async function submitAttendance(matchId, status) {
      if (!currentUser) return alert('請先登入！');
      const res = await apiRequest('POST', { action: 'checkIn', matchId, userId: currentUser.id, status });
      alert(res.message);
      loadMatches();
    }

    // 查看出席名單與出賽排陣 Modal
    async function viewMatchDetails(matchId, opponent, venue) {
      document.getElementById('modalMatchTitle').innerText = `VS ${opponent}`;
      document.getElementById('modalMatchVenue').innerText = `地點: ${venue || '待定'}`;
      document.getElementById('modalAttList').innerHTML = '載入名單中...';
      document.getElementById('modalLineupList').innerHTML = '載入排陣中...';
      document.getElementById('detailModal').classList.remove('hidden');

      const res = await apiRequest('GET', { action: 'getMatchDetails', matchId });
      if (!res.success) return;

      // 渲染出席名單
      const atts = res.attendanceList;
      if (atts.length === 0) {
        document.getElementById('modalAttList').innerHTML = '<p class="text-slate-400">目前尚無隊友簽到。</p>';
      } else {
        document.getElementById('modalAttList').innerHTML = atts.map(a => {
          let badge = a.status === 'attending' ? '<span class="text-emerald-400 font-bold">出席</span>' :
                      (a.status === 'late' ? '<span class="text-amber-400 font-bold">遲到</span>' : '<span class="text-rose-400">缺席</span>');
          return `
            <div class="flex justify-between items-center bg-slate-700/50 p-2 rounded">
              <span><b>${a.name}</b> (Rt. ${a.rating || 0})</span>
              ${badge}
            </div>
          `;
        }).join('');
      }

      // 渲染排陣名單
      const lineup = res.lineup || [];
      const legFormat = res.legFormat || [];
      if (lineup.length === 0) {
        document.getElementById('modalLineupList').innerHTML = '<p class="text-slate-400 text-center py-2">隊長尚未提交本場出賽陣容。</p>';
      } else {
        document.getElementById('modalLineupList').innerHTML = legFormat.map((leg, idx) => {
          const players = lineup[idx] || [];
          const playerNames = players.map(pid => {
            const p = atts.find(u => String(u.userId) === String(pid));
            return p ? `${p.name} (Rt.${p.rating})` : '未指定';
          }).join('、');
          return `
            <div class="border-b border-slate-700/50 pb-1.5 last:border-0">
              <span class="text-yellow-400 font-semibold block">${leg.name}</span>
              <span class="text-slate-200">${playerNames || '<span class="text-slate-500">未安排</span>'}</span>
            </div>
          `;
        }).join('');
      }
    }

    // 打開隊長排陣 Modal (只按出席隊友處理)
    async function openLineupModal(matchId, opponent) {
      currentLineupMatchId = matchId;
      const container = document.getElementById('lineupLegsContainer');
      container.innerHTML = '<p class="text-center text-slate-400">正在獲取出席隊友名單與組別賽制...</p>';
      document.getElementById('lineupModal').classList.remove('hidden');

      const res = await apiRequest('GET', { action: 'getMatchDetails', matchId });
      if (!res.success) return alert('載入失敗');

      // 嚴格篩選：只允許狀態為 attending 或 late 的隊員
      currentAvailablePlayers = (res.attendanceList || []).filter(p => p.status === 'attending' || p.status === 'late');
      currentLegFormat = res.legFormat || [];
      const savedLineup = res.lineup || [];

      if (currentAvailablePlayers.length === 0) {
        container.innerHTML = `
          <div class="text-center py-6 text-slate-300">
            <p class="text-base font-bold text-rose-400 mb-1">⚠️ 暫無出席隊友</p>
            <p class="text-xs text-slate-400">目前未有隊員報名「出席」或「遲到」，無法排陣。</p>
          </div>
        `;
        return;
      }

      // 動態產生每一輪 (Leg) 嘅隊員選單
      container.innerHTML = currentLegFormat.map((leg, legIdx) => {
        const assignedPlayers = savedLineup[legIdx] || [];
        let selectsHtml = '';
        for (let i = 0; i < leg.count; i++) {
          const selectedPid = assignedPlayers[i] || '';
          selectsHtml += `
            <select data-leg="${legIdx}" data-slot="${i}" class="lineup-select w-full p-2 rounded bg-slate-700 text-xs border border-slate-600 mb-1.5">
              <option value="">-- 選擇出戰隊員 (人選 ${i + 1}) --</option>
              ${currentAvailablePlayers.map(p => `
                <option value="${p.userId}" ${String(p.userId) === String(selectedPid) ? 'selected' : ''}>
                  ${p.name} (Rating: ${p.rating})
                </option>
              `).join('')}
            </select>
          `;
        }
        return `
          <div class="bg-slate-700/40 p-2.5 rounded-xl border border-slate-600/60">
            <label class="block font-bold text-yellow-400 mb-1.5">${leg.name} (${leg.count} 人)</label>
            ${selectsHtml}
          </div>
        `;
      }).join('');
    }

    // 隊長儲存排陣
    async function submitLineup() {
      if (!currentLineupMatchId) return;
      const selects = document.querySelectorAll('.lineup-select');
      const lineup = [];

      currentLegFormat.forEach((leg, legIdx) => {
        lineup[legIdx] = [];
        for (let i = 0; i < leg.count; i++) {
          const sel = document.querySelector(`.lineup-select[data-leg="${legIdx}"][data-slot="${i}"]`);
          if (sel && sel.value) {
            lineup[legIdx].push(sel.value);
          }
        }
      });

      const res = await apiRequest('POST', {
        action: 'saveLineup',
        matchId: currentLineupMatchId,
        lineup: lineup
      });

      alert(res.message || '排陣已更新！');
      closeModal('lineupModal');
      loadMatches();
    }

    // 讀取當前 Phoenix 設定
    async function loadSettings() {
      const res = await apiRequest('GET', { action: 'getSettings' });
      if (res.success && res.settings) {
        document.getElementById('cfgCpttnId').value = res.settings.cpttnId || '';
        document.getElementById('cfgDivisionId').value = res.settings.divisionId || '';
        document.getElementById('cfgTeamName').value = res.settings.teamName || '';
      }
    }

    // 隊長儲存當季 Phoenix 設定
    async function saveLeagueSettings() {
      const cpttnId = document.getElementById('cfgCpttnId').value.trim();
      const divisionId = document.getElementById('cfgDivisionId').value.trim();
      const teamName = document.getElementById('cfgTeamName').value.trim();
      if (!cpttnId || !divisionId) return alert('請填寫完整編號');

      const res = await apiRequest('POST', {
        action: 'saveSettings', cpttnId, divisionId, teamName
      });
      alert(res.message);
      loadPhoenixData();
    }

    // 讀取 Phoenix 聯賽官方賽程
    async function loadPhoenixData() {
      const container = document.getElementById('phoenixDataContainer');
      const divLabel = document.getElementById('phoenixCurrentDivision');
      container.innerHTML = '<p class="text-center text-slate-400 py-4">正在同步最新賽事...</p>';

      const res = await apiRequest('GET', { action: 'getPhoenixData' });
      if (res.success && res.data && res.data.length > 0) {
        const team = res.teamName || '';
        divLabel.innerText = `我隊：${team || '未指定'}`;
        container.innerHTML = res.data.map(m => {
          const isMyTeam = team && (m.homeTeam.includes(team) || m.awayTeam.includes(team));
          return `
            <div class="bg-slate-800 p-3 rounded-lg border ${isMyTeam ? 'border-rose-500' : 'border-slate-700'}">
              <div class="flex justify-between text-slate-400 mb-1">
                <span>第 ${m.round} 輪</span>
                <span>${m.date}</span>
              </div>
              <div class="flex justify-between items-center text-sm font-bold">
                <span class="${team && m.homeTeam.includes(team) ? 'text-rose-400' : ''}">${m.homeTeam}</span>
                <span class="bg-slate-900 px-2 py-0.5 rounded text-yellow-400 text-xs">${m.score || 'VS'}</span>
                <span class="${team && m.awayTeam.includes(team) ? 'text-rose-400' : ''}">${m.awayTeam}</span>
              </div>
              <p class="text-slate-400 mt-1">地點: ${m.venue}</p>
            </div>
          `;
        }).join('');
      } else {
        container.innerHTML = `<p class="text-slate-400 text-center py-4">未找到 Phoenix 賽事資料，請確認隊長設定之組別編號。</p>`;
      }
    }

    async function loadStats() {
      const tbody = document.getElementById('statsTableBody');
      const res = await apiRequest('GET', { action: 'getStats' });
      if (!res.success || !res.stats) return;
      tbody.innerHTML = res.stats.map(s => `
        <tr>
          <td class="p-3 font-semibold">${s.name}</td>
          <td class="p-3">${s.rating}</td>
          <td class="p-3 text-emerald-400 font-bold">${s.attendedCount} 場</td>
        </tr>
      `).join('');
    }

    async function loadAdminData() {
      const pendingList = document.getElementById('pendingUsersList');
      const res = await apiRequest('GET', { action: 'getUsers' });
      if (!res.success || !res.users) return;
      const pending = res.users.filter(u => u.status === 'pending');
      if (pending.length === 0) {
        pendingList.innerHTML = '<p class="text-slate-400 text-xs">目前沒有待審核會員。</p>';
        return;
      }
      pendingList.innerHTML = pending.map(u => `
        <div class="flex justify-between items-center bg-slate-700 p-2 rounded">
          <span>${u.name} (Rt.${u.rating})</span>
          <button onclick="activateUser('${u.id}')" class="bg-emerald-600 px-2 py-1 rounded text-xs">啟用</button>
        </div>
      `).join('');
    }

    async function activateUser(userId) {
      const res = await apiRequest('POST', { action: 'activateUser', userId });
      if (res.success) {
        alert('已啟用！');
        loadAdminData();
      }
    }

    async function addMatch() {
      const date = document.getElementById('newMatchDate').value;
      const opponent = document.getElementById('newOpponent').value.trim();
      const venue = document.getElementById('newVenue').value.trim();
      const isHome = document.getElementById('newIsHome').checked;
      if (!opponent) return alert('請輸入對手名稱');
      const res = await apiRequest('POST', { action: 'addMatch', date, opponent, venue, isHome, notes: '' });
      if (res.success) {
        alert('賽事已新增！');
        loadMatches();
      }
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }
  </script>
</body>
</html>
