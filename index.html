<!-- 3. 隊長管理分頁 -->
<section id="tab-admin" class="hidden space-y-4">
  <h2 class="text-sm font-bold text-yellow-400">隊長專屬後台</h2>

  <div class="bg-slate-800 p-4 rounded-xl border border-yellow-500/40 space-y-3 shadow-lg">
    <div class="flex justify-between items-center">
      <h3 class="text-xs font-bold text-yellow-400">🎯 Phoenix 聯賽賽程同步</h3>
      <a href="https://play.phoenixdarts.com/selectCpttnList.do?cpttnType=ML" target="_blank" class="text-[10px] text-rose-400 underline">開啟官網 ↗</a>
    </div>
    
    <!-- 網址輸入框 -->
    <div>
      <label class="text-slate-400 block mb-1 text-[11px]">貼上 Phoenix 賽事網址 (或直接按載入)：</label>
      <input type="text" id="cfgUrlInput" value="https://play.phoenixdarts.com/selectMatchListML.do?cpttnId=97460" class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 text-xs font-mono text-slate-200 focus:border-yellow-400">
    </div>

    <!-- 步驟 1: 提取組別與隊伍選單 -->
    <button type="button" onclick="fetchDivisionsAndTeams()" id="btnFetchMenu" class="w-full bg-slate-700 hover:bg-slate-600 border border-slate-500 text-white font-bold p-2.5 rounded-lg text-xs transition flex justify-center items-center gap-2 cursor-pointer">
      <span>🔍 步驟 1：載入該賽事的所有組別與隊伍</span>
    </button>

    <!-- 步驟 2: 選擇組別與隊伍 -->
    <div class="grid grid-cols-2 gap-2 pt-1">
      <div>
        <label class="text-[10px] text-slate-400 block mb-1">組別 (Division)</label>
        <select id="divisionDropdown" onchange="onDivisionChange()" class="w-full p-2 rounded bg-slate-700 border border-slate-600 text-[11px] text-white">
          <option value="">請先按步驟 1 載入</option>
        </select>
      </div>
      <div>
        <label class="text-[10px] text-slate-400 block mb-1">我的隊伍 (Team)</label>
        <select id="teamDropdown" class="w-full p-2 rounded bg-slate-700 border border-slate-600 text-[11px] text-white">
          <option value="">請先選組別</option>
        </select>
      </div>
    </div>

    <!-- 步驟 3: 確定同步 -->
    <button type="button" onclick="confirmSyncMatches()" id="autoSyncBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-3 rounded-xl text-xs transition shadow-lg flex justify-center items-center gap-2 cursor-pointer">
      <span class="text-sm">🚀</span>
      <span>步驟 2：確認並一鍵同步隊伍賽程</span>
    </button>
  </div>

  <!-- 待審批會員 -->
  <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
    <h3 class="text-xs font-bold mb-2">待審批會員啟用</h3>
    <div id="pendingUsersList" class="space-y-2 text-xs"></div>
  </div>
</section>
